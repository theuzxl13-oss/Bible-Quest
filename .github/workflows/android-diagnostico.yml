name: Aplicativo Android — diagnóstico da Central 3D (build temporário)

# BUILD TEMPORÁRIO DE DIAGNÓSTICO, separado do APK oficial (android.yml).
# A instrumentação (tools/android/diagnostico/instrumentar.cjs) é aplicada só
# dentro deste executor, numa cópia descartável; nada dela é commitado, e o APK
# de diagnóstico não é guardado como artefato nem publicado.
# Grava os registros em docs/relatorios/evidencias/android-diagnostico-central/.

on:
  push:
    branches: ['claude/bible-quest-android']
    paths:
      - '.github/workflows/android-diagnostico.yml'
      - 'tools/android/diagnostico/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-diagnostico
  cancel-in-progress: false

jobs:
  diagnostico:
    name: Diagnóstico da Central 3D (Android 16, sistema "user")
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: SDK do Android (plataforma 36 e build-tools 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build de diagnóstico (instrumentado só aqui)
        run: |
          set -e
          npm ci
          node tools/android/diagnostico/instrumentar.cjs
          git diff --stat
          npm run build:android
          grep -q "__bqDiag" dist/assets/*.js
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleDebug)
          mkdir -p teste
          cp android/app/build/outputs/apk/debug/app-debug.apk teste/app-diagnostico.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging teste/app-diagnostico.apk | grep "versionName='0.17.9-diagnostico'"
          # volta a cópia de trabalho ao estado do repositório (a instrumentação não é commitada)
          git checkout -- src android
          rm -f src/__diagnostico.ts
          git status --porcelain -- src android | grep . && { echo "::error::sobrou instrumentação na cópia de trabalho"; exit 1; } || true
          npm install --no-save --no-package-lock playwright@1.63.0

      - name: Habilitar a aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cenários no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          # sistema "user", como nos celulares; o script controla as animações do sistema
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            node tools/android/diagnostico/central-efeito.cjs teste/app-diagnostico.apk evidencias || touch evidencias/FALHA

      - name: Gravar os registros na branch (só documentação)
        if: always()
        run: |
          DEST=docs/relatorios/evidencias/android-diagnostico-central
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp -r evidencias/. "$DEST/" || true
          python3 -m pip install --quiet pillow
          python3 - "$DEST" <<'PY'
          import pathlib, sys
          from PIL import Image
          for f in pathlib.Path(sys.argv[1]).rglob('*.png'):
              im = Image.open(f).convert('RGB')
              if im.width > 540:
                  im = im.resize((540, round(im.height * 540 / im.width)), Image.LANCZOS)
              im.save(f.with_suffix('.jpg'), quality=80)
              f.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Android: registros do diagnóstico da Central 3D (execução ${{ github.run_id }})" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Resultado
        run: test ! -e evidencias/FALHA || { echo "::error::o diagnóstico não terminou (ver erro.txt)"; exit 1; }
