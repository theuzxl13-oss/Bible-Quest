name: Aplicativo Android — verificações complementares

# Verificações pedidas na avaliação da etapa 1. Iniciado só à mão (workflow_dispatch).
# Não muda o jogo nem o APK oficial: as variantes abaixo são montadas só dentro
# do executor, para teste, e nenhuma delas é publicada como artefato.
#   - build de lançamento assinado com a chave de DEPURAÇÃO gerada no executor
#     (nunca uma chave comercial), só para conferir que a depuração do WebView
#     fica desligada fora do APK de depuração;
#   - APK de depuração sem a permissão INTERNET, para conferir se ela é indispensável.
# Ao final, as capturas e os resultados são gravados em
# docs/relatorios/evidencias/android-etapa-1/ nesta mesma branch (só documentação).

on:
  # o workflow_dispatch só aparece quando o fluxo está no main; por isso ele também
  # roda quando este fluxo ou o script de verificação mudam nesta branch
  push:
    branches: ['claude/bible-quest-android']
    paths:
      - '.github/workflows/android-verificacoes.yml'
      - 'tools/android/verificacoes-complementares.cjs'
      - 'tools/android/verificar-no-emulador.cjs'
  workflow_dispatch:
    inputs:
      execucao:
        description: 'Execução do fluxo do APK cujas capturas do emulador serão guardadas'
        required: true
        default: '45281055916'

permissions:
  contents: write
  actions: read

concurrency:
  group: android-verificacoes
  cancel-in-progress: false

jobs:
  verificacoes:
    name: Verificações complementares (Android 16, API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: SDK do Android (plataforma 36 e build-tools 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Dependências e build do aplicativo
        run: |
          npm ci
          npm run build:android
          npx cap sync android
          npm install --no-save --no-package-lock playwright@1.63.0

      - name: APKs de teste (depuração, lançamento de teste e sem INTERNET)
        run: |
          set -e
          mkdir -p teste evidencias/apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          cd android
          # 1) APK de depuração, igual ao do fluxo principal
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../teste/app-debug.apk
          # 2) build de lançamento, assinado SÓ PARA ESTE TESTE com a chave de depuração do executor
          python3 - <<'PY'
          p = 'app/build.gradle'; s = open(p).read()
          a = "release {\n            minifyEnabled false"
          assert a in s, 'bloco release não encontrado'
          open(p, 'w').write(s.replace(a, "release {\n            signingConfig signingConfigs.debug\n            minifyEnabled false"))
          PY
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../teste/app-lancamento-teste.apk
          git checkout -- app/build.gradle
          # 3) APK de depuração sem a permissão INTERNET (remove também a que vier dos plugins)
          python3 - <<'PY'
          p = 'app/src/main/AndroidManifest.xml'; s = open(p).read()
          s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                        '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">')
          a = '<uses-permission android:name="android.permission.INTERNET" />'
          assert a in s, 'permissão INTERNET não encontrada'
          open(p, 'w').write(s.replace(a, '<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />'))
          PY
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../teste/app-sem-internet.apk
          git checkout -- app/src/main/AndroidManifest.xml
          cd ..
          git status --porcelain -- android/app/build.gradle android/app/src/main/AndroidManifest.xml | grep . && { echo "::error::arquivos do projeto ficaram alterados"; exit 1; } || true
          for f in app-debug app-lancamento-teste app-sem-internet; do
            "$AAPT2" dump badging "teste/$f.apk" | grep -vE "^application-label-" > "evidencias/apk/$f.badging.txt"
            "$AAPT2" dump permissions "teste/$f.apk" > "evidencias/apk/$f.permissoes.txt"
          done
          grep -q "application-debuggable" evidencias/apk/app-debug.badging.txt || { echo "::error::o APK de depuração deveria ser depurável"; exit 1; }
          if grep -q "application-debuggable" evidencias/apk/app-lancamento-teste.badging.txt; then echo "::error::o build de lançamento está depurável"; exit 1; fi
          if grep -q "android.permission.INTERNET" evidencias/apk/app-sem-internet.permissoes.txt; then echo "::error::a variante ainda tem INTERNET"; exit 1; fi
          for f in evidencias/apk/*.permissoes.txt; do echo "== $f"; cat "$f"; done

      - name: Habilitar a aceleração (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verificações no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          # imagem com sistema "user" (como nos celulares): nas imagens google_apis
          # ("userdebug"), o WebView liga a depuração em todos os aplicativos
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            node tools/android/verificacoes-complementares.cjs teste/app-debug.apk teste/app-lancamento-teste.apk evidencias/complementos || touch evidencias/FALHA-complementos
            adb install -r teste/app-sem-internet.apk
            node tools/android/verificar-no-emulador.cjs evidencias/sem-internet || touch evidencias/sem-internet/HOUVE-FALHAS

      - name: Capturas do emulador da execução informada
        uses: actions/download-artifact@v4
        with:
          name: verificacao-no-emulador
          run-id: ${{ inputs.execucao || '45281055916' }}
          github-token: ${{ github.token }}
          path: evidencias/emulador-${{ inputs.execucao || '45281055916' }}

      - name: Gravar as evidências na branch (só documentação)
        if: always()
        run: |
          DEST=docs/relatorios/evidencias/android-etapa-1
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp -r evidencias/. "$DEST/"
          # capturas em JPEG de 720 px de largura, para não pesar no repositório
          python3 -m pip install --quiet pillow
          python3 - "$DEST" <<'PY'
          import pathlib, sys
          from PIL import Image
          for f in pathlib.Path(sys.argv[1]).rglob('*.png'):
              im = Image.open(f).convert('RGB')
              if im.width > 720:
                  im = im.resize((720, round(im.height * 720 / im.width)), Image.LANCZOS)
              im.save(f.with_suffix('.jpg'), quality=85)
              f.unlink()
          PY
          ls -R "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Android, etapa 1: evidências das verificações complementares (execução ${{ github.run_id }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Resultado
        run: |
          test ! -e evidencias/FALHA-complementos || { echo "::error::verificações complementares falharam (ver complementos.json)"; exit 1; }
          if [ -e evidencias/sem-internet/HOUVE-FALHAS ]; then echo "::warning::sem a permissão INTERNET, houve falhas (ver sem-internet/resultado.json)"; fi
